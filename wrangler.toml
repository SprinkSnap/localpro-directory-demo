name = "localpro-directory-demo"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
binding = "ASSETS"

# D1 is optional for this demo. The app uses deterministic in-memory seed data
# when DB is unavailable. To enable D1 persistence for portfolio leads:
#   1. npx wrangler d1 create localpro-directory
#   2. Put the real database_id below
#   3. npx wrangler d1 migrations apply localpro-directory --remote
#   4. npm run db:seed:local  (or a remote seed once authorized)
#
# [[d1_databases]]
# binding = "DB"
# database_name = "localpro-directory"
# database_id = "<your-d1-database-id>"
# migrations_dir = "migrations"

[vars]
DEMO_MODE = "true"
PUBLIC_SITE_URL = "https://localprodirectory.chexustudio.com"
PUBLIC_STUDIO_URL = "https://chexustudio.com"
PUBLIC_CASE_STUDY_URL = "https://chexustudio.com/work/localpro-directory"
PUBLIC_PACKAGES_URL = "https://chexustudio.com/packages"
PUBLIC_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
ALLOWED_ORIGINS = "https://localprodirectory.chexustudio.com,http://localhost:4321,http://127.0.0.1:4321"

# Staging: use wrangler.staging.toml
# Secrets: wrangler secret put TURNSTILE_SECRET_KEY
